openapi: 3.1.0
info:
  title: Diagram2Code
  description: Diagram rendering API for Custom GPT Actions and MCP apps, with an
    optional UML-MCP backend.
  version: 2.0.0
servers:
- url: https://openai-uml-plugin.vercel.app
paths:
  /generate_diagram:
    post:
      summary: Generate Diagram Endpoint
      operationId: generate_diagram_endpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagramRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagramResponse'
        '502':
          description: Diagram renderer failed
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DiagramRequest:
      properties:
        lang:
          type: string
          title: Lang
          description: 'Source language: plantuml, mermaid, d2, graphviz, or another
            supported Kroki language.'
        type:
          type: string
          maxLength: 100
          minLength: 1
          title: Type
          description: Diagram type, such as class, sequence or flowchart.
        code:
          type: string
          maxLength: 100000
          minLength: 1
          title: Code
          description: Diagram source text.
        theme:
          type: string
          maxLength: 100
          title: Theme
          default: ''
      type: object
      required:
      - lang
      - type
      - code
      title: DiagramRequest
    DiagramResponse:
      properties:
        url:
          type: string
          title: Url
        content:
          type: string
          title: Content
        playground:
          type: string
          title: Playground
      type: object
      required:
      - url
      - content
      - playground
      title: DiagramResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError

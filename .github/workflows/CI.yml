name: API and MCP tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app.py uml_backend.py test_modern_api.py
      - run: python -m pytest -q
      - name: Check server startup
        shell: bash
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 5003 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5003/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
